<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Timber clamped in a vice, sawn on the waste side of the marked line">
  <style>.l{font:700 26px Arial,Helvetica,sans-serif;fill:#10212B}.t{fill:#0B5550}.h{paint-order:stroke;stroke:#FFFFFF;stroke-width:7px;stroke-linejoin:round}</style>
  <defs>
