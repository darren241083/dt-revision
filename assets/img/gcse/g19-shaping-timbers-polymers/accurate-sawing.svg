    <pattern id="waste" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#F3E8DC"/><path d="M0 0 V12" stroke="#7A4D24" stroke-width="2"/></pattern>
  </defs>
  <rect width="800" height="600" fill="#FFFFFF"/>
