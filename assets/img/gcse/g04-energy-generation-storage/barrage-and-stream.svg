<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Left: a tidal barrage, water flowing from high tide to low tide through a turbine. Right: a tidal stream turbine in a fast current">
  <style>.l{font:700 28px Arial,Helvetica,sans-serif;fill:#10212B}.t{font:700 30px Arial,Helvetica,sans-serif;fill:#0B5550}.h{paint-order:stroke;stroke:#FFFFFF;stroke-width:7px;stroke-linejoin:round}</style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F766E"/></marker>
  </defs>
  <rect width="800" height="600" fill="#FFFFFF"/>
  <path d="M400 60 V540" stroke="#DCE3E6" stroke-width="2"/>
  <text class="t" x="200" y="90" text-anchor="middle">barrage</text>
  <text class="t" x="600" y="90" text-anchor="middle">tidal stream</text>
  <rect x="30" y="230" width="160" height="250" fill="#E2F2EF"/>
  <rect x="240" y="330" width="130" height="150" fill="#E2F2EF"/>
  <path d="M30 230 H190 M240 330 H370" stroke="#0F766E" stroke-width="2"/>
  <text class="l" x="36" y="215">high tide</text>
  <text class="l" x="368" y="315" text-anchor="end">low tide</text>
  <path d="M175 480 L190 190 H240 L255 480 z" fill="#E8ECF1" stroke="#10212B" stroke-width="2"/>
  <rect x="172" y="410" width="86" height="40" fill="#FFFFFF" stroke="#10212B" stroke-width="2"/>
  <circle cx="215" cy="430" r="14" fill="#FFFFFF" stroke="#0F766E" stroke-width="3"/>
  <path d="M215 416 V444 M201 430 H229" stroke="#0F766E" stroke-width="3"/>
  <path d="M60 430 H160" stroke="#0F766E" stroke-width="4" marker-end="url(#ah)"/>
  <path d="M270 430 H350" stroke="#0F766E" stroke-width="4" marker-end="url(#ah)"/>
  <text class="l" x="215" y="530" text-anchor="middle">turbine</text>
  <path d="M30 480 H370 V500 H30 z" fill="#F7EED9" stroke="#10212B" stroke-width="2"/>
  <path d="M430 200 Q455 188 480 200 T530 200 T580 200 T630 200 T680 200 T730 200 T770 200 V480 H430 z" fill="#E2F2EF" stroke="#0F766E" stroke-width="2"/>
  <path d="M430 480 H770 V500 H430 z" fill="#F7EED9" stroke="#10212B" stroke-width="2"/>
  <path d="M594 480 L600 340 H612 L618 480 z" fill="#E8ECF1" stroke="#10212B" stroke-width="2"/>
  <rect x="586" y="318" width="60" height="28" rx="10" fill="#FFFFFF" stroke="#10212B" stroke-width="2"/>
  <path d="M586 332 L570 270 M586 332 L560 372 M586 332 L590 392" stroke="#0F766E" stroke-width="7" stroke-linecap="round"/>
  <circle cx="586" cy="332" r="7" fill="#0F766E"/>
  <g stroke="#0F766E" stroke-width="4">
    <path d="M450 290 H530" marker-end="url(#ah)"/><path d="M450 360 H530" marker-end="url(#ah)"/><path d="M450 430 H530" marker-end="url(#ah)"/>
    <path d="M670 320 H750" marker-end="url(#ah)"/><path d="M670 400 H750" marker-end="url(#ah)"/>
  </g>
  <text class="l h" x="600" y="250" text-anchor="middle">fast current</text>
</svg>
