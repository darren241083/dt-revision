<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A manufacturing cell: a robot loads several reprogrammable CNC machines, making different products">
  <style>.l{font:700 26px Arial,Helvetica,sans-serif;fill:#10212B}.t{fill:#0B5550}</style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F766E"/></marker>
    <g id="cnc">
      <rect x="0" y="0" width="140" height="110" rx="8" fill="#E8ECF1" stroke="#10212B" stroke-width="2"/>
      <rect x="14" y="16" width="70" height="78" rx="4" fill="#FFFFFF" stroke="#10212B" stroke-width="2"/>
      <rect x="96" y="16" width="32" height="24" rx="3" fill="#E2F2EF" stroke="#0F766E" stroke-width="2"/>
      <circle cx="104" cy="60" r="5" fill="#0F766E"/><circle cx="120" cy="60" r="5" fill="#0F766E"/>
      <path d="M49 24 V54" stroke="#10212B" stroke-width="4"/><rect x="34" y="68" width="30" height="16" fill="#F3E8DC" stroke="#7A4D24" stroke-width="2"/>
    </g>
  </defs>
  <rect width="800" height="600" fill="#FFFFFF"/>
  <use href="#cnc" x="60" y="80"/>
  <use href="#cnc" x="330" y="40"/>
  <use href="#cnc" x="600" y="80"/>
  <text class="l" x="400" y="190" text-anchor="middle">CNC machines</text>
  <circle cx="400" cy="330" r="44" fill="#E8ECF1" stroke="#10212B" stroke-width="2"/>
  <path d="M400 330 L470 262 L540 300" fill="none" stroke="#0F766E" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="400" cy="330" r="12" fill="#FFFFFF" stroke="#10212B" stroke-width="2"/>
  <circle cx="470" cy="262" r="9" fill="#FFFFFF" stroke="#10212B" stroke-width="2"/>
  <path d="M540 300 l14 -6 M540 300 l12 12" stroke="#10212B" stroke-width="4" stroke-linecap="round"/>
  <text class="l" x="300" y="345" text-anchor="end">robot</text>
  <rect x="40" y="440" width="720" height="34" rx="17" fill="#48596B" stroke="#10212B" stroke-width="2"/>
  <g fill="#FFFFFF" stroke="#10212B" stroke-width="2"><circle cx="70" cy="457" r="8"/><circle cx="230" cy="457" r="8"/><circle cx="390" cy="457" r="8"/><circle cx="550" cy="457" r="8"/><circle cx="730" cy="457" r="8"/></g>
  <rect x="440" y="400" width="44" height="40" fill="#F3E8DC" stroke="#7A4D24" stroke-width="3"/>
  <ellipse cx="560" cy="420" rx="24" ry="20" fill="#E3EDF8" stroke="#1F5590" stroke-width="3"/>
  <path d="M640 440 L664 398 L688 440 z" fill="#E2F2EF" stroke="#0F766E" stroke-width="3"/>
  <path d="M60 520 H740" stroke="#0F766E" stroke-width="4" marker-end="url(#ah)"/>
  <text class="l t" x="400" y="566" text-anchor="middle">different products from the same cell</text>
</svg>
